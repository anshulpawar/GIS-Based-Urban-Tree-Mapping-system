services:
  - type: web
    name: gis-based-urban-tree-mapping-system
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "https://gis-based-urban-tree-mapping-system.vercel.app,http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"
      - key: GEE_PROJECT_ID
        value: urban-tree-mapping
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
