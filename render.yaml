services:
  - type: web
    name: urban-greenwatch-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: GEE_PROJECT_ID
        value: urban-tree-mapping
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
